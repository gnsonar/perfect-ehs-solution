<article class="training-card" tabindex="0" (click)="selected.emit(training)" (keydown.enter)="selected.emit(training)" (keydown.space)="$event.preventDefault(); selected.emit(training)">
  <div class="training-card-top">
    <span class="pill">{{ training.category }}</span>
    <span class="training-date">{{ training.date }}</span>
  </div>
  <h3>{{ training.title }}</h3>
  <ul class="training-meta">
    @if (training.time) {
      <li><strong>Time:</strong> {{ training.time }}</li>
    }
    <li><strong>Venue:</strong> {{ training.venue }}</li>
    @if (training.seats) {
      <li><strong>Status:</strong> {{ training.seats }}</li>
    }
  </ul>
  <button class="text-link" type="button" (click)="$event.stopPropagation(); selected.emit(training)">{{ actionLabel }}</button>
</article>
